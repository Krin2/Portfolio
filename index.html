<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <title>Marcos Frigerio | Desarrollador Fullstack</title>

      content="Portfolio de Marcos Frigerio: ingeniero electrónico con 10 años en automatización, hoy desarrollador de software en camino a fullstack."
    />
    <meta name="theme-color" content="#0d0d12" />
    <script>
      // Aplica el tema guardado (o el del sistema) antes de pintar para evitar parpadeo
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Marcos Frigerio | Desarrollador Fullstack" />
    <meta
      property="og:description"
